:root{--blue:#0a9dff;--blue-deep:#0a6cff;--green:#22c55e}

<script>
/* ================= CONFIG ================= */
// WARNING: a key placed in front-end code is public. Regenerate it on RapidAPI and,
// ideally, move these calls into your own Cloudflare Worker.
const RAPIDAPI_KEY = '862cb8c605msh783f2febd45eaf8p14b926jsnf979a1579235';
const REQUIRE_AUDIO = true; // pick the highest quality that HAS sound; if none has sound, the highest overall
const FALLBACK_API = 'https://jerrycoder.oggyapi.workers.dev/down/alldown?url=';

const PLATFORMS = [
  ['instagram.com','Instagram'],['instagr.am','Instagram'],['youtube.com','YouTube'],['youtu.be','YouTube'],
  ['facebook.com','Facebook'],['fb.watch','Facebook'],['fb.com','Facebook'],['tiktok.com','TikTok'],
  ['twitter.com','Twitter'],['x.com','X (Twitter)'],['pinterest.','Pinterest'],['pin.it','Pinterest'],
  ['snapchat.com','Snapchat'],['reddit.com','Reddit'],['redd.it','Reddit'],['threads.net','Threads'],
  ['linkedin.com','LinkedIn'],['vimeo.com','Vimeo'],['dailymotion.com','Dailymotion'],['t.me','Telegram'],
  ['soundcloud.com','SoundCloud'],['spotify.com','Spotify'],['likee','Likee'],['sharechat.com','ShareChat'],
  ['twitch.tv','Twitch'],['tumblr.com','Tumblr']
];

const $ = id => document.getElementById(id);
const input = $('linkInput'), clearBtn = $('clearBtn'), searchBtn = $('searchBtn');
const loader = $('loader'), errBox = $('error');
const emptyState = $('emptyState');

/* ================= LOGO ================= */
(function () {
  const icon = document.querySelector('link[rel="apple-touch-icon"]').href;
  $('popupLogo').src = icon;
  $('favicon').href = icon;
})();

/* ================= BASIC UI ================= */
/* ================= PWA INSTALL BUTTON ================= */
const popup = $('bottomPopup'), popupName = popup.querySelector('.name');
const popupText = popupName.textContent;
let installEvent = null;

const isInstalled = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
if (isInstalled()) popup.style.display = 'none';

window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvent = e; });
window.addEventListener('appinstalled', () => { installEvent = null; popup.style.display = 'none'; });

function hint(text) {
  popupName.textContent = text;
  clearTimeout(hint.t);
  hint.t = setTimeout(() => { popupName.textContent = popupText; }, 7000);
}

$('appBtn').addEventListener('click', async () => {
  if (installEvent) {                       // Android / desktop Chrome, Edge: real install dialog
    installEvent.prompt();
    const choice = await installEvent.userChoice.catch(() => null);
    installEvent = null;
    if (choice && choice.outcome === 'accepted') popup.style.display = 'none';
    return;
  }
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  hint(ios ? 'Tap Share, then "Add to Home Screen"' : 'Open the browser menu, then tap "Install app" / "Add to Home screen"');
});

input.addEventListener('input', () => {
  clearBtn.classList.toggle('show', input.value.length > 0);
  errBox.classList.remove('show');
});
clearBtn.addEventListener('click', () => {
  input.value = '';
  clearBtn.classList.remove('show');
  resetView();
  emptyState.classList.remove('hide');
  input.focus();
});
input.addEventListener('keydown', e => { if (e.key === 'Enter') search(); });
searchBtn.addEventListener('click', search);

function resetView() { errBox.classList.remove('show'); closeViewer(); }
function showError(msg) { errBox.textContent = msg; errBox.classList.add('show'); }
function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}

/* ================= URL EXTRACTION / VALIDATION ================= */
// Accepts: plain links, links with spaces/newlines around them, shared text that
// contains a link ("Watch this https://..."), and links without https://.
// Rejects: ordinary text, emoji, numbers, etc.
function extractUrl(raw) {
  if (!raw) return null;
  const text = String(raw).trim();

  const m = text.match(/https?:\/\/[^\s<>"'`]+/i);
  if (m) return m[0].replace(/[)\]}>.,;!?]+$/, '');

  // no protocol: look for tokens like instagram.com/reel/abc or youtu.be/xyz
  const tokens = text.split(/\s+/);
  for (const tk of tokens) {
    const t = tk.replace(/^[(\[<"']+|[)\]>"'.,;!?]+$/g, '');
    if (!/^(www\.|m\.)?[a-z0-9-]+(\.[a-z0-9-]+)*\.[a-z]{2,}(:\d+)?(\/\S*)?$/i.test(t)) continue;
    const full = 'https://' + t;
    if (knownPlatform(full) || t.includes('/')) return full;
  }
  return null;
}

function isValidHttpUrl(str) {
  if (!str) return false;
  try {
    const u = new URL(str);
    if (u.protocol !== 'http:' && u.protocol !== 'https:') return false;
    const host = u.hostname;
    if (!host.includes('.') || host.startsWith('.') || host.endsWith('.')) return false;
    return /^[a-z]{2,}$/i.test(host.split('.').pop());
  } catch (e) { return false; }
}

function youtubeId(link) {
  try {
    const u = new URL(link);
    const host = u.hostname.replace(/^(www|m)\./, '').toLowerCase();
    if (host === 'youtu.be') return u.pathname.slice(1).split('/')[0];
    if (host.includes('youtube.com')) {
      const v = u.searchParams.get('v');
      if (v) return v;
      const m = /\/(shorts|embed|live|v)\/([\w-]{6,})/.exec(u.pathname);
      return m ? m[2] : '';
    }
  } catch (e) {}
  return '';
}

function knownPlatform(link) {
  try {
    const host = new URL(link).hostname.replace(/^www\./, '').toLowerCase();
    for (const [key, name] of PLATFORMS) if (host.includes(key)) return name;
  } catch (e) {}
  return null;
}

function platformName(link, alt) {
  const known = knownPlatform(link) || (alt && knownPlatform(alt));
  if (known) return known;
  try {
    const parts = new URL(link).hostname.replace(/^www\./, '').toLowerCase().split('.');
    const base = parts.length > 1 ? parts[parts.length - 2] : parts[0];
    return base.charAt(0).toUpperCase() + base.slice(1);
  } catch (e) { return 'Media'; }
}

function cleanTitle(t, platform) {
  t = (t || '').trim();
  if (!t || /^https?:\/\//i.test(t) || /^[\d\s._#:\-]+$/.test(t)) return platform;
  if (/^[A-Za-z0-9_-]{10,}$/.test(t) && /\d/.test(t)) return platform;
  return t;
}

function extFromUrl(u) {
  try {
    const p = new URL(u).pathname.split('.');
    const e = p.length > 1 ? p.pop().toLowerCase() : '';
    return /^[a-z0-9]{2,5}$/.test(e) ? e : '';
  } catch (e) { return ''; }
}

/* ================= API RESPONSE PARSER ================= */
function normalizeApiData(raw, link) {
  if (!raw || typeof raw !== 'object') return null;

  const isObj = v => v && typeof v === 'object' && !Array.isArray(v);
  const root = isObj(raw.data) ? raw.data : isObj(raw.result) ? raw.result : raw;

  const ytId = youtubeId(link);
  const thumbs = root.thumbnails;
  const defaultThumb =
    (typeof root.thumbnail === 'string' && root.thumbnail) || root.thumb || root.picture || root.cover || root.image ||
    (typeof raw.thumbnail === 'string' && raw.thumbnail) ||
    (Array.isArray(thumbs) && thumbs.length ? (thumbs[thumbs.length - 1].url || thumbs[0].url || thumbs[0]) : '') ||
    (ytId ? `https://img.youtube.com/vi/${ytId}/hqdefault.jpg` : '');

  const title = root.title || root.description || root.caption || raw.title || (root.meta && root.meta.title) || '';
  const medias = [];
  const isHttp = s => typeof s === 'string' && /^https?:\/\//i.test(s);

  const pushMedia = (obj, fallbackType) => {
    if (!obj) return;
    if (isHttp(obj)) {
      medias.push({ url: obj, quality: 'HD', extension: extFromUrl(obj) || (fallbackType === 'image' ? 'jpg' : 'mp4'),
        type: fallbackType || 'video', is_audio: true, audioAvailable: true, thumbnail: defaultThumb });
      return;
    }
    const mediaUrl = obj.hdplay || obj.hd_url || obj.url || obj.link || obj.download_url || obj.dlink || obj.src || obj.play || obj.wmplay;
    if (!isHttp(mediaUrl)) return;

    const mime = String(obj.mimeType || obj.mime || '').toLowerCase();
    const ext = String(obj.extension || obj.ext || extFromUrl(mediaUrl) || 'mp4').toLowerCase().split('/')[0].replace(/[^a-z0-9]/g, '') || 'mp4';
    let type = String(obj.type || fallbackType || '').toLowerCase();
    if (!['video', 'audio', 'image'].includes(type)) {
      if (mime.startsWith('audio/') || ['mp3', 'm4a', 'aac', 'ogg', 'opus', 'wav'].includes(ext)) type = 'audio';
      else if (mime.startsWith('image/') || ['jpg', 'jpeg', 'png', 'webp', 'gif'].includes(ext)) type = 'image';
      else type = 'video';
    }
    const hasAud = obj.is_audio !== false && obj.audioAvailable !== false && obj.hasAudio !== false &&
      obj.audio !== false && obj.no_audio !== true && obj.acodec !== 'none';

    medias.push({
      url: mediaUrl,
      quality: obj.qualityLabel || obj.quality || obj.label || obj.subname || (obj.height ? obj.height + 'p' : 'HD'),
      resolution: obj.resolution || (obj.width && obj.height ? `${obj.width}x${obj.height}` : ''),
      extension: ext, type, is_audio: hasAud, audioAvailable: hasAud,
      bitrate: +obj.bitrate || +obj.bandwidth || +obj.size || +obj.contentLength || 0,
      thumbnail: obj.thumbnail || obj.cover || defaultThumb
    });
  };

  // medias[]
  if (Array.isArray(root.medias)) root.medias.forEach(m => pushMedia(m));
  else if (Array.isArray(raw.medias)) raw.medias.forEach(m => pushMedia(m));

  // YouTube muxed formats (video + sound)
  if (Array.isArray(root.formats)) {
    root.formats.forEach(f => {
      if (f && isHttp(f.url)) medias.push({
        url: f.url, quality: f.qualityLabel || f.quality || (f.height ? f.height + 'p' : '360p'),
        resolution: f.width && f.height ? `${f.width}x${f.height}` : '', extension: 'mp4', type: 'video',
        is_audio: true, audioAvailable: true, thumbnail: defaultThumb
      });
    });
  }

  // YouTube adaptive formats
  if (Array.isArray(root.adaptiveFormats)) {
    root.adaptiveFormats.forEach(f => {
      if (f && isHttp(f.url)) {
        const isAud = (f.mimeType || '').startsWith('audio/');
        const hasAud = isAud || (f.mimeType || '').includes('mp4a') || !!f.audioQuality;
        medias.push({
          url: f.url, quality: f.qualityLabel || f.quality || (f.height ? f.height + 'p' : ''),
          resolution: f.width && f.height ? `${f.width}x${f.height}` : '', extension: isAud ? 'm4a' : 'mp4',
          type: isAud ? 'audio' : 'video', is_audio: hasAud, audioAvailable: hasAud, thumbnail: defaultThumb
        });
      }
    });
  }

  // generic arrays
  ['links', 'urls', 'videos', 'video', 'images', 'picker'].forEach(key => {
    if (Array.isArray(root[key])) root[key].forEach(item => pushMedia(item, key === 'images' ? 'image' : 'video'));
  });

  // simple { high, low } style responses (common in free workers)
  if (!medias.length) {
    [['high', 'HD'], ['hd', 'HD'], ['low', 'SD'], ['sd', 'SD']].forEach(([k, q]) => {
      if (isHttp(root[k])) pushMedia({ url: root[k], quality: q, type: 'video' });
    });
  }

  // single URL responses
  if (!medias.length) {
    const single = root.video_url || root.download_url || root.link || root.dlink || root.hdplay || root.play ||
      (typeof root.url === 'string' && root.url !== link ? root.url : null);
    if (isHttp(single)) pushMedia({ url: single, quality: 'HD', type: 'video' });
    else if (isHttp(root.image_url)) pushMedia({ url: root.image_url, type: 'image' }, 'image');
  }

  return medias.length ? { title, thumbnail: defaultThumb, medias } : null;
}

/* ================= FETCHER ================= */
async function fetchMediaInfo(link) {
  const ytId = youtubeId(link);
  const rapid = host => ({ 'X-RapidAPI-Key': RAPIDAPI_KEY, 'X-RapidAPI-Host': host });
  const endpoints = [];

  if (ytId) {
    ['ytstream-download-youtube-videos.p.rapidapi.com', 'yt-api.p.rapidapi.com'].forEach(h =>
      endpoints.push({ url: `https://${h}/dl?id=${encodeURIComponent(ytId)}`, options: { method: 'GET', headers: rapid(h) } }));
  }

  ['social-download-all-in-one.p.rapidapi.com', 'auto-download-all-in-one.p.rapidapi.com'].forEach(h =>
    endpoints.push({
      url: `https://${h}/v1/social/autolink`,
      options: { method: 'POST', headers: { 'content-type': 'application/json', ...rapid(h) }, body: JSON.stringify({ url: link }) }
    }));

  endpoints.push({
    url: 'https://all-media-downloader1.p.rapidapi.com/all',
    options: {
      method: 'POST',
      headers: { 'content-type': 'application/x-www-form-urlencoded', ...rapid('all-media-downloader1.p.rapidapi.com') },
      body: new URLSearchParams({ url: link }).toString()
    }
  });

  // your RapidAPI key is tried first; the free worker is only the last backup
  endpoints.push({ url: FALLBACK_API + encodeURIComponent(link), options: { method: 'GET' } });

  let bestFallback = null;

  for (const ep of endpoints) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 15000);
    try {
      const res = await fetch(ep.url, { ...ep.options, signal: controller.signal });
      if (!res.ok) continue;
      const text = await res.text();
      let raw;
      try { raw = JSON.parse(text); } catch (e) { continue; }
      const normalized = normalizeApiData(raw, link);
      if (!normalized) continue;

      if (ytId && REQUIRE_AUDIO) {
        if (normalized.medias.some(m => kindOf(m) === 'video' && hasAudioTrack(m, 'YouTube'))) return normalized;
        if (!bestFallback) bestFallback = normalized;
      } else {
        return normalized;
      }
    } catch (e) {
      /* try next endpoint */
    } finally {
      clearTimeout(timer);
    }
  }

  if (bestFallback) return bestFallback;
  throw new Error('Could not fetch media');
}

/* ================= SEARCH ================= */
async function search() {
  resetView();
  const link = extractUrl(input.value);

  // only non-links (plain text, emoji, numbers...) show this error
  if (!link || !isValidHttpUrl(link)) {
    emptyState.classList.remove('hide');
    return showError('Please enter a valid URL.');
  }
  input.value = link;
  clearBtn.classList.add('show');
  emptyState.classList.add('hide');
  loader.classList.add('show');
  searchBtn.disabled = true;

  try {
    const data = await fetchMediaInfo(link);
    const items = buildItems(data, platformName(link));
    if (!items.length) throw new Error('no media');
    openViewer(items);
  } catch (e) {
    emptyState.classList.remove('hide');
    showError('Could not get media from this link. It may be private, unsupported, or the server is busy. Try again.');
  } finally {
    loader.classList.remove('show');
    searchBtn.disabled = false;
  }
}

/* ================= MEDIA HELPERS ================= */
function extOf(m) { return m.extension ? String(m.extension).toLowerCase() : extFromUrl(m.url || ''); }

function kindOf(m) {
  const t = String(m.type || '').toLowerCase();
  if (t === 'video' || t === 'audio' || t === 'image') return t;
  if (t === 'photo' || t === 'picture') return 'image';
  const e = extOf(m);
  if (['jpg', 'jpeg', 'png', 'webp', 'gif', 'heic', 'avif'].includes(e)) return 'image';
  if (['mp3', 'm4a', 'aac', 'wav', 'ogg', 'opus'].includes(e)) return 'audio';
  return 'video';
}

function heightOf(m) {
  const t = [m.resolution, m.quality, m.label].join(' ').toLowerCase();
  const r = /(\d{3,4})\s*[x×]\s*(\d{3,4})/.exec(t);
  if (r) return Math.min(+r[1], +r[2]);
  const q = /(\d{3,4})\s*p/.exec(t);
  if (q) return +q[1];
  if (/8k|4320/.test(t)) return 4320;
  if (/4k|2160|uhd/.test(t)) return 2160;
  if (/2k|1440/.test(t)) return 1440;
  if (/1080|full\s*hd|fhd/.test(t)) return 1080;
  if (/720/.test(t)) return 720;
  if (/\bhd\b|high|original|best/.test(t)) return 720;
  if (/\bsd\b|low|normal/.test(t)) return 360;
  return 0;
}

function hasAudioTrack(m, platform) {
  if (m.is_audio === false || m.audioAvailable === false || m.hasAudio === false || m.audio === false || m.no_audio === true || m.acodec === 'none') return false;
  const q = String(m.quality || m.label || m.format || '').toLowerCase();
  if (/no audio|mute|video only|without audio/.test(q)) return false;
  const u = String(m.url || '');
  if (platform === 'YouTube' || u.includes('googlevideo.com')) {
    const it = /[?&]itag=(\d+)/.exec(u);
    if (it) return [18, 22, 37, 38, 43, 44, 45, 46, 59, 78].includes(parseInt(it[1], 10));
  }
  return true;
}

function buildItems(data, platform) {
  const medias = data.medias.filter(m => m && m.url);
  const mainThumb = data.thumbnail || '';
  const thumbs = new Set([mainThumb, ...medias.map(m => m.thumbnail)].filter(Boolean));
  const single = ['YouTube', 'Pinterest', 'TikTok'].includes(platform);

  const groups = new Map(), items = [], audios = [];

  medias.forEach(m => {
    const k = kindOf(m);
    if (k === 'video') {
      const key = single ? 'main_vid' : (m.thumbnail || mainThumb || 'x');
      if (!groups.has(key)) {
        const g = { kind: 'video', thumb: m.thumbnail || mainThumb, raw: [] };
        groups.set(key, g); items.push(g);
      }
      groups.get(key).raw.push(m);
    } else if (k === 'audio') {
      audios.push(m);
    } else if (!thumbs.has(m.url)) {
      items.push({ kind: 'image', thumb: m.url, options: [{ media: m, label: 'Photo', sound: true }] });
    }
  });

  const hasVideo = groups.size > 0;
  const list = items.filter(it => !(hasVideo && it.kind === 'image' && (single || platform === 'Facebook')));

  list.forEach(it => {
    if (it.kind !== 'video') return;
    const annotated = it.raw.map(m => ({ media: m, h: heightOf(m), sound: hasAudioTrack(m, platform), isMp4: extOf(m) === 'mp4' }));
    const withSound = annotated.filter(x => x.sound);
    const pool = (REQUIRE_AUDIO && withSound.length) ? withSound : annotated;
    pool.sort((a, b) => ((b.h || 480) - (a.h || 480)) || ((b.isMp4 ? 1 : 0) - (a.isMp4 ? 1 : 0)) || ((b.media.bitrate || 0) - (a.media.bitrate || 0)));
    const best = pool[0];
    it.options = [{ media: best.media, label: best.h ? best.h + 'p' : 'Video', sound: best.sound }];
  });

  if (!list.length && audios.length) list.push({ kind: 'audio', thumb: mainThumb, options: [{ media: audios[0], label: 'Audio', sound: true }] });

  if (!list.length && medias.length) {
    const first = medias.find(m => kindOf(m) === 'image') || medias[0];
    list.push({ kind: kindOf(first), thumb: kindOf(first) === 'image' ? first.url : mainThumb, options: [{ media: first, label: 'Download', sound: true }] });
  }
  return list.filter(it => it.options && it.options.length);
}

/* ================= FULL-SCREEN VIEWER (native player controls: use its menu to download) ================= */
function closeViewer() {
  const v = $('viewer');
  if (!v) return;
  if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(() => {});
  v.remove();
  document.body.style.overflow = '';
}

function openViewer(items) {
  closeViewer();
  const viewer = el('div', 'viewer');
  viewer.id = 'viewer';
  const x = el('button', 'close', '✕');
  x.type = 'button';
  x.setAttribute('aria-label', 'Close');
  x.addEventListener('click', closeViewer);
  viewer.appendChild(x);

  let firstVideo = null;
  items.forEach(it => {
    const url = it.options[0].media.url;
    const box = el('div', 'item');
    let node;
    if (it.kind === 'image') {
      node = document.createElement('img');
      node.referrerPolicy = 'no-referrer';
      node.src = url;
    } else {
      node = document.createElement('video');
      node.src = url;
      node.controls = true;
      node.autoplay = true;
      node.preload = 'auto';
      if (!firstVideo) firstVideo = node;
    }
    box.appendChild(node);
    viewer.appendChild(box);
  });

  document.body.appendChild(viewer);
  document.body.style.overflow = 'hidden';

  if (firstVideo) {
    firstVideo.play().catch(() => {});
    try {
      const fs = firstVideo.requestFullscreen || firstVideo.webkitRequestFullscreen;
      if (fs) { const p = fs.call(firstVideo); if (p && p.catch) p.catch(() => {}); }
      else if (firstVideo.webkitEnterFullscreen) firstVideo.webkitEnterFullscreen();
    } catch (e) {}
  }
}
